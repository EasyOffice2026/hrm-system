app = "hrm-system"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  UPLOAD_DIR = "/data/uploads"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[mounts]
  source = "hrm_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
